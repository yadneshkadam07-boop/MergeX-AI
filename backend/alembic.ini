# Alembic configuration. The database URL is NOT stored here: env.py reads it
# from app.core.config so there is exactly one source of truth (.env).
[alembic]
script_location = alembic
prepend_sys_path = .
# `path_separator` replaces the deprecated `version_path_separator`.
path_separator = os
# Timestamped, readable revision filenames: 20261016_1430-abc123_add_x.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Keep generated migrations formatted like the rest of the codebase.
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = --config pyproject.toml REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
