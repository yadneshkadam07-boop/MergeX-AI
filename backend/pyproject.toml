[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergex-backend"
version = "0.1.0"
description = "MergeX AI - multi-agent software integration & validation platform (API + analysis engine)"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
  # --- Web framework ---
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12",      # multipart/form-data for ZIP upload
  "sse-starlette>=2.1,<3.0",       # Server-Sent Events for live progress

  # --- Persistence ---
  "SQLAlchemy[asyncio]>=2.0.36,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<0.31",
  "greenlet>=3.1",                 # required by SQLAlchemy's asyncio bridge

  # --- Observability ---
  "structlog>=24.4,<26.0",

  # --- HTTP clients (GitHub REST, OSV.dev) ---
  "httpx>=0.27,<0.29",
  "tenacity>=9.0,<10.0",           # retry/backoff for external calls

  # --- AI orchestration (explanation layer only) ---
  "google-genai>=1.0,<2.0",
  "langgraph>=0.2.50,<2.0",

  # --- Deterministic code analysis ---
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.26",
  "sqlglot>=25.30,<28.0",          # SQL migration / DDL parsing
  "packaging>=24.0",               # dependency version range comparison
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
  "black>=24.10,<26.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
  "aiosqlite>=0.20,<1.0",          # in-memory DB for fast unit tests
  "types-requests",
]

[tool.setuptools.packages.find]
include = ["app*"]

# =============================================================================
# Ruff - linting + import sorting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["fixtures", ".workspace", "alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "ASYNC",     # async correctness
  "S",         # bandit security rules
  "PTH",       # prefer pathlib
  "RET",       # return consistency
  "ARG",       # unused arguments
  "TID",       # tidy imports
  "ANN",       # missing type annotations
]
ignore = [
  "ANN401",    # allow typing.Any where genuinely dynamic
  "B008",      # FastAPI Depends()/File() in defaults is the documented idiom
  "S101",      # assert is fine (tests, internal invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "S105", "S106", "S108"]
# Fixture repos deliberately contain insecure code; they are analysis input.
"fixtures/**" = ["ALL"]
"app/models/__init__.py" = ["F401"]
"app/api/routes/__init__.py" = ["F401"]
# Starlette fixes the exception-handler signature at `(request, exc)`; a
# handler that needs only one of them still has to accept both.
"app/main.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# =============================================================================
# Black - formatting
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  | fixtures
  | \.workspace
  | alembic/versions
)/
'''

# =============================================================================
# mypy - static typing
# =============================================================================
[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
exclude = ['^fixtures/', '^\.workspace/', '^alembic/versions/']
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
  "tree_sitter.*",
  "tree_sitter_python.*",
  "tree_sitter_javascript.*",
  "tree_sitter_typescript.*",
  "langgraph.*",
  "sse_starlette.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `deprecated` 3.x (a transitive dependency of opentelemetry-api, itself pulled
# in by langgraph) uses PEP 695 `type` statements, which do not parse under our
# 3.11 target. We never import it directly, so skip it rather than lowering
# the target version. On Python 3.11 pip resolves an older `deprecated` and
# this override is simply inert.
module = ["deprecated.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a live Postgres database",
  "network: performs real outbound network calls",
  "llm: requires a real GEMINI_API_KEY",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
# Quality bar: the analysis engine must stay at or above 70% coverage.
precision = 1
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
