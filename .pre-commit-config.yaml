# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^backend/fixtures/
      - id: end-of-file-fixer
        exclude: ^backend/fixtures/
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(tsconfig.*\.json|components\.json)$ # JSONC: comments allowed
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      # Hard stop: platform credentials must never enter history.
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        name: ruff (import-safe format check)
        files: ^backend/
        # Black is the formatter of record; ruff-format only verifies agreement.
        args: [--check]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        args: [--config-file, backend/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - types-requests

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json)$
        pass_filenames: false
