# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
# Only the pre-commit stage is used; there is no commit-msg hook, and listing
# that stage made every hook run a second time per commit.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^backend/fixtures/
      - id: end-of-file-fixer
        exclude: ^backend/fixtures/
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(tsconfig.*\.json|components\.json)$ # JSONC: comments allowed
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes mandates CRLF for PowerShell scripts; this hook
        # would rewrite them to LF on every commit.
        exclude: \.ps1$
      - id: check-added-large-files
        args: [--maxkb=512]
      # Hard stop: platform credentials must never enter history.
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/
        args: [--config, backend/pyproject.toml]

  - repo: local
    hooks:
      # NOTE: there is deliberately no mypy hook here.
      #
      # mypy needs the project's real dependency set (FastAPI, SQLAlchemy,
      # structlog) to resolve imports, and pre-commit cannot reliably supply
      # it: `language: system` fails because the git hook does not put the
      # project venv on PATH (on Windows `python` then resolves to the
      # Microsoft Store stub and reports "Python was not found"), while
      # `language: python` with `additional_dependencies: ["./backend[dev]"]`
      # depends on how a given pip version parses path-plus-extras.
      #
      # mypy --strict is enforced where it works, against the project venv:
      #     make check          /  .\scripts\dev.ps1 check
      #     make typecheck      /  .\scripts\dev.ps1 typecheck
      # and in the `backend` job of .github/workflows/ci.yml, which gates
      # every pull request.

      - id: frontend-lint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-format
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json)$
        pass_filenames: false
